name: Publish to PyPI

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token stored.
# Fully automated release: push a vX.Y.Z tag and this builds, publishes to PyPI
# and the MCP Registry, then creates the GitHub Release (auto-generated notes —
# edit them afterwards if you want hand-written ones).
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

# Run all JavaScript actions on Node 24 (Node 20 is deprecated on the runners).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Stamp the release commit into the package
        # Record the exact commit this wheel is built from so `db-conn-mcp -v`
        # reports it on any device. GITHUB_SHA is the tagged release commit.
        run: sed -i "s/^__commit__ = .*/__commit__ = \"${GITHUB_SHA}\"/" src/db_conn_mcp/__init__.py
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp:
    name: Publish to MCP Registry
    needs: publish # ensure the PyPI package (with the mcp-name marker) is live first
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC -> tokenless auth, io.github.<owner> namespace
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Sync server.json version to the release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          cat server.json
      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

  release:
    name: Create GitHub Release
    needs: publish # only release what actually made it to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release/tag
    steps:
      - uses: actions/checkout@v6
      - name: Extract this version's section from CHANGELOG.md
        # CHANGELOG.md is the single source of truth for release notes, so GitHub,
        # PyPI and the repo cannot disagree. Literal prefix matching (index(), not
        # regex) keeps the version's dots and brackets from needing escaping.
        # Stops at the next "## [" heading or at the link-reference block.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found && index($0, "[") == 1 && index($0, "]: ") > 0 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md || true
          if [ -s release-notes.md ]; then
            echo "Using the CHANGELOG section for $VERSION:"
            cat release-notes.md
          else
            # Never fail a release over missing notes — fall back to generated ones.
            echo "::warning::No CHANGELOG.md section for $VERSION; falling back to --generate-notes"
          fi
      - name: Create the GitHub Release for this tag (skipped if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — nothing to do."
          elif [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
