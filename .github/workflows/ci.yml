name: CI

# Lint and test on every push and pull request. `publish.yml` only runs on a
# vX.Y.Z tag and never runs the suite, so this is the workflow that actually
# guards main.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# Run all JavaScript actions on Node 24 (Node 20 is deprecated on the runners).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  # A newer push to the same ref cancels the older run — except on main.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12" # lint once; ruff's target-version drives the rules
      - name: Install ruff at the pinned version
        # From the dev extra, so pyproject stays the single source of truth for
        # dependencies (Rule 4) and CI runs the exact ruff a developer has locally.
        run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one version failing must not hide the others
      matrix:
        # Every version the package claims in `requires-python` + classifiers.
        # Add "3.15" here and to the classifiers when it ships (2026-10-01).
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          # Windows and macOS on the floor version only. `client_specs()` branches
          # three ways on sys.platform — win32, darwin (~/Library/Application
          # Support), and everything else — so each needs a runner, but that path
          # logic does not vary by Python version. Free either way: public repos
          # get unlimited standard-runner minutes on all three OSes (the 10x macOS
          # multiplier applies only to private repos).
          - python-version: "3.12"
            os: windows-latest
          - python-version: "3.12"
            os: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and its dev + doctor extras
        # `doctor` brings psutil so the process_staleness check is exercised
        # rather than degrading to `skipped`.
        run: python -m pip install -e ".[dev,doctor]"
      - name: Run the test suite
        run: python -m pytest -q

  live:
    name: Live Postgres
    # The only place the catalog SQL runs against a real server: the fake connection in
    # test_postgres.py never executes it. -rs prints a skip's reason, so a missing
    # DB_CONN_MCP_TEST_DSN shows up in the log instead of passing silently.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the package and its dev extra
        run: python -m pip install -e ".[dev]"
      - name: Run the live Postgres tests
        env:
          # A throwaway service container; 127.0.0.1, not localhost, so the client
          # does not try IPv6 first.
          DB_CONN_MCP_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: python -m pytest -q -rs tests/test_postgres_live.py

  mutation:
    name: Mutation (changed lines)
    # Advisory: mutates the src/ lines a PR changes and fails when a mutant survives, i.e.
    # when no test tells the changed line from a faulty one. Pull requests only; a push
    # to main has no base to compare with.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A hung mutant run must not hold the runner for the default six hours.
    timeout-minutes: 20
    services:
      # Same service as `live`: mutants in dialects/postgres.py are only caught by the live tests.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the check diffs from the merge base, which a shallow clone lacks
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the package and its dev + doctor extras
        # `doctor` brings psutil so the process_staleness tests run instead of skipping,
        # which would let their mutants survive.
        run: python -m pip install -e ".[dev,doctor]"
      - name: Mutate the changed lines
        env:
          # Passed through env: so the base branch name is never interpolated into the shell.
          BASE_REF: ${{ github.base_ref }}
          # A throwaway service container; 127.0.0.1, not localhost, so the client
          # does not try IPv6 first.
          DB_CONN_MCP_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: python scripts/mutation_check.py --base "origin/$BASE_REF"
