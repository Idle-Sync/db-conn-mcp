name: CI

# Lint and test on every push and pull request. `publish.yml` only runs on a
# vX.Y.Z tag and never runs the suite, so this is the workflow that actually
# guards main.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# Run all JavaScript actions on Node 24 (Node 20 is deprecated on the runners).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  # A newer push to the same ref cancels the older run — except on main.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12" # lint once; ruff's target-version drives the rules
      - run: python -m pip install --upgrade "ruff>=0.6.0"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one version failing must not hide the others
      matrix:
        # Every version the package claims in `requires-python` + classifiers.
        # Add "3.15" here and to the classifiers when it ships (2026-10-01).
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          # Windows and macOS on the floor version only: the path handling
          # (server_launch, config resolution, client config paths) is the
          # OS-specific part, and it does not vary by Python version.
          - python-version: "3.12"
            os: windows-latest
          - python-version: "3.12"
            os: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and its dev + doctor extras
        # `doctor` brings psutil so the process_staleness check is exercised
        # rather than degrading to `skipped`.
        run: python -m pip install -e ".[dev,doctor]"
      - name: Run the test suite
        run: python -m pytest -q
