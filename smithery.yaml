# Smithery configuration — https://smithery.ai/docs/build/project-config/smithery.yaml
# db-conn-mcp is a local (stdio) MCP server distributed on PyPI. `uvx` fetches and
# runs it without a separate install step.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      configPath:
        type: string
        description: >-
          Absolute path to your connections.json. If omitted, db-conn-mcp looks for
          ./connections.json then ~/.db-conn-mcp/connections.json. Create one first
          with `db-conn-mcp setup` (it never logs or exposes your DSN).
    required: []
  commandFunction: |
    (config) => ({
      command: "uvx",
      args: ["db-conn-mcp"].concat(config.configPath ? ["--config", config.configPath] : [])
    })
exampleConfig:
  configPath: /home/you/.db-conn-mcp/connections.json
