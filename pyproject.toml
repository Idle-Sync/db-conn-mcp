[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db-conn-mcp"
version = "0.1.1"
description = "A dead-simple, self-hosted MCP server for securely querying databases via AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "db-conn-mcp contributors" }]
keywords = ["mcp", "model-context-protocol", "postgresql", "database", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]

# Single source of truth for dependencies (Rule 4 — no requirements.txt).
dependencies = [
    "mcp>=1.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "build>=1.2.0",
]

[project.scripts]
db-conn-mcp = "db_conn_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/Idle-Sync/db-conn-mcp"
Repository = "https://github.com/Idle-Sync/db-conn-mcp"
Issues = "https://github.com/Idle-Sync/db-conn-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/db_conn_mcp"]

# ---- Ruff: strict, consistent linting + formatting (Rule 2) ----
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# A pragmatic-but-strict selection: pycodestyle, pyflakes, isort, bugbear,
# comprehensions, pyupgrade, simplify, and pep8-naming.
select = ["E", "F", "I", "B", "C4", "UP", "SIM", "N", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # asserts are expected in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---- Pytest ----
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
